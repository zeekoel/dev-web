<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Bank - Espace Business</title>
    <style>
        :root {
            --bleu-marin: #001a33;
            --violet: #6a0dad;
            --noir: #121212;
            --blanc: #ffffff;
            --gris-bg: #f0f2f5;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--gris-bg);
            overflow-x: hidden;
        }

        header {
            background-color: var(--bleu-marin);
            color: white;
            padding: 0 5%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--violet);
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
        }

        header a { text-decoration: none; color: inherit; }
        .logo { font-size: 1.5rem; font-weight: bold; letter-spacing: 2px; }
        .logo span { color: var(--violet); }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: var(--blanc);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover { color: var(--violet); }

        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }

        .menu-toggle .bar {
            width: 25px;
            height: 3px;
            background-color: white;
            margin: 4px 0;
            transition: 0.4s;
        }

        .btn-login {
            background-color: var(--violet);
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .auth-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;
            padding: 120px 8% 50px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .auth-section {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .auth-section h2 { color: var(--bleu-marin); margin-bottom: 25px; }

        .input-box { margin-bottom: 20px; }
        .input-box label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
        .input-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            outline-color: var(--violet);
        }

        .auth-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-login-main { background: var(--bleu-marin); color: white; }
        .btn-signup-main { background: var(--violet); color: white; }

        @media screen and (max-width: 768px) {
            .menu-toggle { display: flex; order: 2; }
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 70px;
                left: 0;
                width: 100%;
                background-color: var(--bleu-marin);
                padding: 20px 0;
                border-bottom: 2px solid var(--violet);
            }
            .nav-links.active { display: flex; }
            .nav-links li { margin: 15px 0; text-align: center; }
            .btn-desktop { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html"><div class="logo">ATLAS<span>BANK</span></div></a>
        <nav>
            <ul class="nav-links" id="nav-menu">
                <li><a href="offres.html">Nos offres</a></li>
                <li><a href="transaction.html">Transactions</a></li>
                <li><a href="user.html">User</a></li>
                <li><a href="E-banking.html">E-Banking</a></li>
            </ul>
        </nav>
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <a href="contact.html" class="btn-desktop"><button class="btn-login">Accès Client</button></a>
    </header>

    <main class="auth-container">
        <section class="auth-section">
            <h2>Accès Professionnel</h2>
            <form>
                <div class="input-box">
                    <label>Identifiant Business</label>
                    <input type="text" placeholder="Entrez votre identifiant">
                </div>
                <div class="input-box">
                    <label>Code Secret</label>
                    <input type="password" placeholder="••••••••">
                </div>
                <button type="submit" class="auth-btn btn-login-main">Se Connecter</button>
            </form>
        </section>

        <section class="auth-section">
            <h2>Devenir Partenaire</h2>
            <form>
                <div class="input-box">
                    <label>Nom de l'entreprise</label>
                    <input type="text" placeholder="Ex: Atlas Tech SARL">
                </div>
                <div class="input-box">
                    <label>ICE</label>
                    <input type="text" placeholder="15 chiffres">
                </div>
                <button type="submit" class="auth-btn btn-signup-main">Demander l'ouverture</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
